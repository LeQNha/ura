name: urban_archaeology
description: "Urban Archaeology - Crowdsourced urban exploration app"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # UI / Typography
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # Observation feature (Phase 1)
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  http: ^1.2.2
  intl: ^0.19.0

  # Map feature (Phase 2) — OpenStreetMap, 100% miễn phí, không cần API key
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  flutter_map_marker_cluster: ^1.3.6

  # Urban Scanner (Phase 4) — camera + la bàn cho AR overlay
  camera: ^0.11.0+2
  flutter_compass: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
